name: ci

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的已有 tag, 留空时只构建 artifact"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      is_release: ${{ steps.release_context.outputs.is_release }}
      tag_name: ${{ steps.release_context.outputs.tag_name }}
      source_ref: ${{ steps.release_context.outputs.source_ref }}
      version: ${{ steps.release_version.outputs.version }}
      build_version: ${{ steps.build_version.outputs.build_version }}
    steps:
      - name: 解析发布上下文
        id: release_context
        env:
          EVENT_NAME: ${{ github.event_name }}
          CURRENT_REF: ${{ github.ref }}
          CURRENT_REF_NAME: ${{ github.ref_name }}
          CURRENT_SHA: ${{ github.sha }}
          DISPATCH_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          is_release=false
          tag_name=""
          source_ref="$CURRENT_SHA"

          if [[ "$EVENT_NAME" == "push" && "$CURRENT_REF" == refs/tags/* ]]; then
            is_release=true
            tag_name="$CURRENT_REF_NAME"
            source_ref="$CURRENT_REF"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$DISPATCH_TAG" ]]; then
            git check-ref-format "refs/tags/$DISPATCH_TAG"
            is_release=true
            tag_name="$DISPATCH_TAG"
            source_ref="refs/tags/$DISPATCH_TAG"
          fi

          echo "is_release=$is_release" >> "$GITHUB_OUTPUT"
          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"

      - name: 检出目标提交
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release_context.outputs.source_ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: 准备 uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: 校验发布版本
        id: release_version
        if: steps.release_context.outputs.is_release == 'true'
        shell: bash
        env:
          TAG_NAME: ${{ steps.release_context.outputs.tag_name }}
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "tag 格式无效: $TAG_NAME" >&2
            exit 1
          fi
          if [[ ! -s "docs/changelog/$version.md" ]]; then
            echo "缺少 release notes: docs/changelog/$version.md" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: 解析构建版本
        id: build_version
        env:
          IS_RELEASE: ${{ steps.release_context.outputs.is_release }}
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$IS_RELEASE" == "true" ]]; then
            echo "build_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "build_version=$(PROJECT_PACKAGE_VERSION=0.0.0 uv run --no-project python scripts/build-version.py)" >> "$GITHUB_OUTPUT"

  test:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - name: 检出目标提交
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.source_ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: 准备 uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: 准备 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: 准备 Bun
        uses: oven-sh/setup-bun@v2

      - name: Go 测试
        run: go test ./...

      - name: 前端测试
        run: bun test tests/editor.test.mjs tests/editor-ui.test.mjs

      - name: 后端对拍
        run: python3 -B -m unittest discover -s tests -p 'test_*.py' -v

  build:
    needs: version
    strategy:
      fail-fast: false
      # 当前发布 4 个平台; CUDA 只构建 x86_64, macOS 只提供 CPU 搜索器.
      matrix:
        include:
          # CUDA 12.8 与 VS 2026 不兼容, Windows 使用 VS 2022.
          - os: windows-2022
            platform: windows
            arch: x86_64
            cuda: true
            cuda_dir: 'C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.8'
            cuda_bin: 'C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.8\bin'
            cuda_method: local
            cuda_packages: '[]'
          - os: ubuntu-22.04
            platform: linux
            arch: x86_64
            cuda: true
            cuda_dir: /usr/local/cuda-12.8
            cuda_bin: /usr/local/cuda-12.8/bin
            cuda_method: network
            cuda_packages: '["nvcc","cudart","cudart-dev","crt"]'
          - os: macos-15-intel
            platform: macos
            arch: x86_64
            cuda: false
          - os: macos-15
            platform: macos
            arch: aarch64
            cuda: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: 检出目标提交
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.source_ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: 准备 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: 准备 uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: 准备 CUDA 缓存目录
        if: matrix.cuda && matrix.platform == 'linux'
        shell: bash
        run: |
          sudo mkdir -p "${{ matrix.cuda_dir }}"
          sudo chown -R "$USER" "${{ matrix.cuda_dir }}"

      - name: 恢复 CUDA Toolkit 缓存
        if: matrix.cuda
        id: cuda-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ matrix.cuda_dir }}
          key: cuda-12.8.1-${{ matrix.os }}-${{ matrix.arch }}-sub-v1
          restore-keys: |
            cuda-12.8.1-${{ matrix.os }}-${{ matrix.arch }}-

      - name: 安装 CUDA Toolkit
        if: matrix.cuda && steps.cuda-cache.outputs.cache-hit != 'true'
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "12.8.1"
          method: ${{ matrix.cuda_method }}
          sub-packages: ${{ matrix.cuda_packages }}
          log-file-suffix: ${{ matrix.os }}.txt

      - name: 保存 CUDA Toolkit 缓存
        if: matrix.cuda && steps.cuda-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ matrix.cuda_dir }}
          key: cuda-12.8.1-${{ matrix.os }}-${{ matrix.arch }}-sub-v1

      - name: 配置缓存的 CUDA
        if: matrix.cuda && steps.cuda-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          printf 'CUDA_PATH=%s\n' "${{ matrix.cuda_dir }}" >> "$GITHUB_ENV"
          printf '%s\n' "${{ matrix.cuda_bin }}" >> "$GITHUB_PATH"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            "${{ matrix.cuda_bin }}/nvcc.exe" --version
          else
            "${{ matrix.cuda_bin }}/nvcc" --version
          fi

      - name: 准备 MSVC 环境
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: 构建与打包
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          TARGET_ARCH: ${{ matrix.arch }}
          PROJECT_BUILD_VERSION: v${{ needs.version.outputs.build_version }}
        shell: bash
        run: uv run --no-project python scripts/dist.py

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: terraria-seed-searcher-${{ needs.version.outputs.build_version }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    if: needs.version.outputs.is_release == 'true'
    needs: [version, test, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: 检出发布 tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.source_ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: 重新获取 annotated tag object
        env:
          TAG_NAME: ${{ needs.version.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          git check-ref-format "refs/tags/$TAG_NAME"
          git fetch --force origin "refs/tags/$TAG_NAME:refs/tags/$TAG_NAME"

      - name: 校验 tag annotation
        env:
          TAG_NAME: ${{ needs.version.outputs.tag_name }}
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag_ref="refs/tags/$TAG_NAME"
          manual_notes="docs/changelog/$VERSION.md"

          if [[ ! -s "$manual_notes" ]]; then
            echo "缺少 release notes: $manual_notes" >&2
            exit 1
          fi

          tag_type="$(git cat-file -t "$tag_ref")"
          if [[ "$tag_type" != "tag" ]]; then
            echo "发布 tag 必须是 annotated tag: $TAG_NAME" >&2
            exit 1
          fi

          git cat-file tag "$tag_ref" | sed '1,/^$/d' > tag-notes.md
          if ! grep -q '[^[:space:]]' tag-notes.md; then
            echo "发布 tag 的 annotation 不能为空: $TAG_NAME" >&2
            exit 1
          fi

          if ! cmp -s "$manual_notes" tag-notes.md; then
            echo "发布 tag 的 annotation 与 $manual_notes 不一致" >&2
            diff -u "$manual_notes" tag-notes.md || true
            exit 1
          fi

      - name: 生成 release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.version.outputs.tag_name }}
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          manual_notes="docs/changelog/$VERSION.md"
          base_tag_file="docs/changelog/$VERSION-base.txt"
          api_args=(
            --method POST
            "repos/$GITHUB_REPOSITORY/releases/generate-notes"
            -f "tag_name=$TAG_NAME"
          )

          target_sha="$(git rev-parse HEAD)"
          api_args+=(-f "target_commitish=$target_sha")

          if [[ -s "$base_tag_file" ]]; then
            base_tag="$(<"$base_tag_file")"
            git check-ref-format "refs/tags/$base_tag"
            api_args+=(-f "previous_tag_name=$base_tag")
          fi

          gh api "${api_args[@]}" --jq '.body' > generated-notes.md
          cp "$manual_notes" release-notes.md

          if [[ -s generated-notes.md ]]; then
            printf '\n---\n\n' >> release-notes.md
            cat generated-notes.md >> release-notes.md
          fi

      - name: 下载构建产物
        uses: actions/download-artifact@v8
        with:
          pattern: terraria-seed-searcher-*
          merge-multiple: true
          path: release-artifacts

      - name: 生成校验和
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd release-artifacts
          archives=(terraria-seed-searcher-*.tar.gz terraria-seed-searcher-*.zip)

          if (( ${#archives[@]} != 4 )); then
            echo "预期 4 个归档, 实际找到 ${#archives[@]} 个" >&2
            exit 1
          fi

          sha256sum "${archives[@]}" > SHA256SUMS

      - name: 创建或更新 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.version.outputs.tag_name }}
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(
            release-artifacts/terraria-seed-searcher-*.tar.gz
            release-artifacts/terraria-seed-searcher-*.zip
            release-artifacts/SHA256SUMS
          )

          if (( ${#assets[@]} != 5 )); then
            echo "预期 5 个发布文件, 实际找到 ${#assets[@]} 个" >&2
            exit 1
          fi

          prerelease_args=()
          if [[ "$VERSION" == *-* ]]; then
            prerelease_args+=(--prerelease)
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" \
              --verify-tag \
              --title "terraria-seed-searcher v$VERSION" \
              --notes-file release-notes.md \
              "${prerelease_args[@]}"
            gh release upload "$TAG_NAME" "${assets[@]}" --clobber
          else
            gh release create "$TAG_NAME" "${assets[@]}" \
              --verify-tag \
              --title "terraria-seed-searcher v$VERSION" \
              --notes-file release-notes.md \
              "${prerelease_args[@]}"
          fi
