<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>拼接与格子校准</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1d21; color: #ddd;
               font: 13px/1.5 -apple-system, "PingFang SC", sans-serif; overflow: hidden; }
  #side { position: fixed; left: 0; top: 0; bottom: 0; width: 330px; overflow-y: auto;
          background: #24272c; padding: 10px; box-sizing: border-box; }
  #stage { position: absolute; left: 330px; top: 0; }
  h3 { margin: 4px 0 8px; font-size: 13px; color: #8fd; }
  .fr { border: 1px solid #3a3f46; border-radius: 6px; padding: 8px; margin-bottom: 8px; background: #2b2f35; }
  .fr.on { border-color: #4a8; }
  .row { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
  .row label { width: 34px; color: #9aa; }
  input[type=number] { width: 62px; background: #1b1d21; color: #eee; border: 1px solid #444;
                       border-radius: 4px; padding: 2px 4px; }
  input[type=range] { flex: 1; }
  button { background: #356; color: #eee; border: 0; border-radius: 4px; padding: 5px 10px; cursor: pointer; }
  button:hover { background: #478; }
  #out { width: 100%; height: 120px; background: #1b1d21; color: #9d9; border: 1px solid #444;
         border-radius: 4px; font-family: ui-monospace, monospace; font-size: 11px; }
  .hint { color: #889; font-size: 11px; margin: 6px 0; }
</style>
</head>
<body>
<div id="side">
  <h3>拼接与格子校准</h3>
  <div class="hint">拖动图片 = 调整拼接位置; 滚轮 = 缩放; 右键拖 = 平移. 每张可独立设格宽与相位.</div>
  <div class="row"><label>混合</label><input type="range" id="alpha" min="0" max="1" step="0.05" value="0.5"></div>
  <div class="row"><label>网格</label><input type="range" id="galpha" min="0" max="1" step="0.05" value="0.9">
    <span class="hint">透明度</span></div>
  <div class="row"><button id="reset">复位</button><button id="export">导出参数</button><button id="fit">适应窗口</button></div>
  <div id="frames"></div>
  <textarea id="out" readonly placeholder="点 导出参数 得到结果, 发给我即可"></textarea>
</div>
<canvas id="stage"></canvas>
<script>
const FRAMES = [
  { id: 'f3', src: 'shots/spawn-ingame-03.png', tile: 19.5, tileY: 18.5, phx: 0,  phy: 0, x: -1800, y: 0, on: true },
  { id: 'f4', src: 'shots/spawn-ingame-04.png', tile: 19.5, tileY: 18.5, phx: 4.9, phy: 0, x: 0,    y: 0, on: true },
  { id: 'f1', src: 'shots/spawn-ingame-01.png', tile: 14.8, tileY: 14.0, phx: 0,  phy: 0, x: 900,  y: 0, on: true },
  { id: 'f2', src: 'shots/spawn-ingame-02.png', tile: 15.4, tileY: 14.6, phx: 0,  phy: 0, x: 1700, y: 0, on: true },
];
const cvs = document.getElementById('stage'), ctx = cvs.getContext('2d');
let zoom = 0.5, panX = 0, panY = 0, alpha = 0.5, galpha = 0.9, drag = null;

function resize() { cvs.width = innerWidth - 330; cvs.height = innerHeight; draw(); }
addEventListener('resize', resize);

for (const f of FRAMES) {
  f.img = new Image(); f.img.src = f.src + '?v=' + Date.now();
  f.img.onload = draw;
}

function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#1b1d21'; ctx.fillRect(0, 0, cvs.width, cvs.height);
  ctx.setTransform(zoom, 0, 0, zoom, panX, panY);
  for (const f of FRAMES) {
    if (!f.on || !f.img.complete) continue;
    ctx.globalAlpha = alpha;
    ctx.drawImage(f.img, f.x, f.y);
    ctx.globalAlpha = 1;
    // 方块网格
    ctx.globalAlpha = galpha;
    ctx.lineWidth = 1 / zoom;
    ctx.strokeStyle = 'rgba(255,70,70,.85)';
    ctx.beginPath();
    for (let gx = f.phx; gx < f.img.width; gx += f.tile) { ctx.moveTo(f.x + gx, f.y); ctx.lineTo(f.x + gx, f.y + f.img.height); }
    ctx.stroke();
    ctx.strokeStyle = 'rgba(70,200,255,.85)';
    ctx.beginPath();
    for (let gy = f.phy; gy < f.img.height; gy += f.tileY) { ctx.moveTo(f.x, f.y + gy); ctx.lineTo(f.x + f.img.width, f.y + gy); }
    ctx.stroke();
    // 标注
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#ffd'; ctx.font = (14 / zoom) + 'px sans-serif';
    ctx.fillText(f.id, f.x + 6 / zoom, f.y + 20 / zoom);
  }
}

// 命中测试: 取最上面的一张
function hit(mx, my) {
  for (let i = FRAMES.length - 1; i >= 0; i--) {
    const f = FRAMES[i];
    if (!f.on || !f.img.complete) continue;
    if (mx >= f.x && mx <= f.x + f.img.width && my >= f.y && my <= f.y + f.img.height) return f;
  }
  return null;
}
cvs.addEventListener('mousedown', e => {
  const mx = (e.offsetX - panX) / zoom, my = (e.offsetY - panY) / zoom;
  drag = e.button === 2 ? { pan: true, sx: e.offsetX, sy: e.offsetY, px: panX, py: panY }
                        : { f: hit(mx, my), dx: mx, dy: my };
});
addEventListener('mousemove', e => {
  if (!drag) return;
  const r = cvs.getBoundingClientRect();
  const ox = e.clientX - r.left, oy = e.clientY - r.top;
  if (drag.pan) { panX = drag.px + (ox - drag.sx); panY = drag.py + (oy - drag.sy); }
  else if (drag.f) { drag.f.x += (ox - panX) / zoom - drag.dx; drag.f.y += (oy - panY) / zoom - drag.dy;
                     drag.dx = (ox - panX) / zoom; drag.dy = (oy - panY) / zoom; sync(); }
  draw();
});
addEventListener('mouseup', () => drag = null);
cvs.addEventListener('contextmenu', e => e.preventDefault());
cvs.addEventListener('wheel', e => {
  e.preventDefault();
  const k = e.deltaY < 0 ? 1.1 : 1 / 1.1;
  const mx = (e.offsetX - panX) / zoom, my = (e.offsetY - panY) / zoom;
  zoom *= k; panX = e.offsetX - mx * zoom; panY = e.offsetY - my * zoom; draw();
}, { passive: false });

// 侧栏
const box = document.getElementById('frames');
for (const f of FRAMES) {
  const d = document.createElement('div');
  d.className = 'fr on'; d.id = 'box-' + f.id;
  d.innerHTML = `<div class="row"><b>${f.id}</b> <label style="width:auto"><input type="checkbox" checked id="on-${f.id}"> 显示</label></div>
    <div class="row"><label>格宽</label><input type="number" step="0.05" id="tile-${f.id}" value="${f.tile}">
      <label style="width:auto">格高</label><input type="number" step="0.05" id="tileY-${f.id}" value="${f.tileY}"></div>
    <div class="row"><label>相位</label><input type="number" step="0.1" id="phx-${f.id}" value="${f.phx}">
      <input type="number" step="0.1" id="phy-${f.id}" value="${f.phy}"></div>
    <div class="row"><label>X</label><input type="number" step="1" id="x-${f.id}" value="${Math.round(f.x)}">
      <label style="width:auto">Y</label><input type="number" step="1" id="y-${f.id}" value="${Math.round(f.y)}"></div>`;
  box.appendChild(d);
  const bind = (id, key, isInt) => {
    const el = document.getElementById(id + '-' + f.id);
    el.addEventListener('input', () => { f[key] = isInt ? parseInt(el.value) : parseFloat(el.value); draw(); });
  };
  bind('tile', 'tile'); bind('tileY', 'tileY'); bind('phx', 'phx'); bind('phy', 'phy');
  bind('x', 'x', true); bind('y', 'y', true);
  document.getElementById('on-' + f.id).addEventListener('change', e => {
    f.on = e.target.checked;
    document.getElementById('box-' + f.id).classList.toggle('on', f.on);
    document.getElementById('out').value = '';
    draw();
  });
}
function sync() {
  for (const f of FRAMES) {
    document.getElementById('x-' + f.id).value = Math.round(f.x);
    document.getElementById('y-' + f.id).value = Math.round(f.y);
  }
}
document.getElementById('alpha').addEventListener('input', e => { alpha = parseFloat(e.target.value); draw(); });
document.getElementById('galpha').addEventListener('input', e => { galpha = parseFloat(e.target.value); draw(); });
document.getElementById('fit').addEventListener('click', () => {
  const on = FRAMES.filter(f => f.on && f.img.complete);
  if (!on.length) return;
  const x1 = Math.min(...on.map(f => f.x)), x2 = Math.max(...on.map(f => f.x + f.img.width));
  zoom = Math.min(cvs.width / (x2 - x1 + 40), cvs.height / 700) || 0.5;
  panX = 20 - x1 * zoom; panY = cvs.height / 2 - 150 * zoom; draw();
});
document.getElementById('export').addEventListener('click', () => {
  const r = { frames: FRAMES.map(f => ({ id: f.id, src: f.src, tile: f.tile, tileY: f.tileY,
               phaseX: f.phx, phaseY: f.phy, x: Math.round(f.x), y: Math.round(f.y), on: f.on })) };
  document.getElementById('out').value = JSON.stringify(r, null, 1);
});
document.getElementById('reset').addEventListener('click', () => location.reload());
resize();
</script>
</body>
</html>
