<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>拼接调整 + 地表标注</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1d21; color: #ddd;
               font: 13px/1.5 -apple-system, "PingFang SC", sans-serif; overflow: hidden; }
  #side { position: fixed; left: 0; top: 0; bottom: 0; width: 320px; overflow-y: auto;
          background: #24272c; padding: 10px; box-sizing: border-box; }
  #stage { position: absolute; left: 320px; top: 0; }
  h3 { margin: 2px 0 6px; font-size: 13px; color: #8fd; }
  .tool { display: block; width: 100%; text-align: left; margin: 2px 0; background: #2f343b;
          color: #ddd; border: 1px solid #3d434b; border-radius: 5px; padding: 5px 8px; cursor: pointer; }
  .tool.on { background: #2d6; color: #062; border-color: #2d6; font-weight: 600; }
  button.act { background: #356; color: #eee; border: 0; border-radius: 4px; padding: 5px 9px;
               cursor: pointer; margin: 2px 2px 2px 0; }
  .fr { border: 1px solid #3a3f46; border-radius: 6px; padding: 6px; margin-bottom: 6px; background: #2b2f35; }
  .row { display: flex; align-items: center; gap: 5px; margin: 2px 0; }
  .row label { width: 30px; color: #9aa; font-size: 11px; }
  input[type=number] { width: 58px; background: #1b1d21; color: #eee; border: 1px solid #444;
                       border-radius: 4px; padding: 1px 3px; font-size: 11px; }
  #out { width: 100%; height: 140px; background: #1b1d21; color: #9d9; border: 1px solid #444;
         border-radius: 4px; font-family: ui-monospace, monospace; font-size: 11px; }
  .hint { color: #889; font-size: 11px; margin: 5px 0; }
  .kv { color: #ad9; font-size: 11px; margin: 4px 0; }
</style>
</head>
<body>
<div id="side">
  <h3>第一步 调拼接</h3>
  <div class="hint">拖动图片对位; 每张可改格宽/相位; 蓝色横线会跟着改.</div>
  <div id="fbox"></div>
  <h3>第二步 标地表</h3>
  <div id="tools"></div>
  <div class="row"><button class="act" id="undo">撤销</button>
    <button class="act" id="export">导出</button>
    <button class="act" id="fit">适应窗口</button></div>
  <div class="hint">点画布 = 在最近格子打标记 (自动吸附); 右键拖动平移; 滚轮缩放; 中键或擦除工具删标记.</div>
  <div class="kv" id="stat"></div>
  <textarea id="out" readonly placeholder="点 导出 得到 JSON"></textarea>
</div>
<canvas id="stage"></canvas>
<script>
const TOOLS = [
  { id: 'block',  name: '完整方块', color: '#4ade80' },
  { id: 'slopeL', name: '斜坡 左高右低', color: '#fbbf24' },
  { id: 'slopeR', name: '斜坡 右高左低', color: '#f97316' },
  { id: 'tree',   name: '树木 / 作废', color: '#f472b6' },
  { id: 'erase',  name: '擦除标记', color: '#94a3b8' },
];
let tool = 'block', zoom = 0.5, panX = 0, panY = 0, drag = null, showPre = true, Y0 = 0;
const cvs = document.getElementById('stage'), ctx = cvs.getContext('2d');
let FR = [], PRE = [], T = 20.86;
let userMarks = new Map(), history = [];

function resize() { cvs.width = innerWidth - 320; cvs.height = innerHeight; draw(); }
addEventListener('resize', resize);

Promise.all([fetch('data/param1.json').then(r => r.json()),
             fetch('data/mark_prefill.json').then(r => r.json())]).then(([pp, pf]) => {
  T = pf.tile;   // 只取格宽, 不用预标注
  const cfg = pp.frames.filter(f => f.on).sort((a, b) => a.x - b.x);
  for (const c of cfg) {
    const im = new Image(); im.src = c.src; im.onload = draw;
    FR.push({ id: c.id, img: im, x: c.x, y: c.y, tile: c.tile, tileY: c.tileY,
              phx: c.phaseX, phy: c.phaseY, YLO: pf.ylo[c.id] });
  }
  buildSide(); stat(); draw();
});
const X0 = () => Math.min(...FR.map(f => f.x));
const YTOP = () => Math.min(...FR.map(f => f.y));

function draw() {
  if (!FR.length) return;
  const x0 = X0(), y0 = YTOP(); Y0 = y0;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#1b1d21'; ctx.fillRect(0, 0, cvs.width, cvs.height);
  ctx.setTransform(zoom, 0, 0, zoom, panX, panY);
  for (const f of FR) {
    if (!f.img.complete) continue;
    ctx.drawImage(f.img, f.x - x0, f.y - y0);
    ctx.lineWidth = 1 / zoom;
    ctx.strokeStyle = 'rgba(255,70,70,.35)'; ctx.beginPath();
    for (let gx = f.phx; gx < f.img.width; gx += f.tile) {
      ctx.moveTo(f.x - x0 + gx, f.y - y0); ctx.lineTo(f.x - x0 + gx, f.y - y0 + f.img.height);
    }
    ctx.stroke();
    ctx.strokeStyle = 'rgba(70,200,255,.35)'; ctx.beginPath();
    for (let gy = f.phy; gy < f.img.height; gy += f.tileY) {
      ctx.moveTo(f.x - x0, f.y - y0 + gy); ctx.lineTo(f.x - x0 + f.img.width, f.y - y0 + gy);
    }
    ctx.stroke();
    ctx.fillStyle = '#ffd'; ctx.font = (13 / zoom) + 'px sans-serif';
    ctx.fillText(f.id, f.x - x0 + 4 / zoom, f.y - y0 + 15 / zoom);
  }
  // 用户标记
  const r = Math.max(2.5, 4.5 / zoom);
  for (const [col, m] of userMarks) {
    const t = TOOLS.find(t => t.id === m.t) || TOOLS[0];
    ctx.fillStyle = t.color;
    ctx.beginPath(); ctx.arc(col * T, m.y, r, 0, 6.284); ctx.fill();
    if (m.t === 'tree') { ctx.globalAlpha = .22; ctx.fillRect((col - .5) * T, m.y - 150, T, 300); ctx.globalAlpha = 1; }
  }
  // 出生点
  ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 2 / zoom;
  ctx.beginPath(); ctx.moveTo(141 * T, -2000); ctx.lineTo(141 * T, 4000); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.font = (13 / zoom) + 'px sans-serif';
  ctx.fillText('出生点', 141 * T + 5 / zoom, 100);
}
function buildSide() {
  const box = document.getElementById('fbox'); box.innerHTML = '';
  for (const f of FR) {
    const d = document.createElement('div'); d.className = 'fr';
    d.innerHTML = `<div class="row"><b>${f.id}</b>
        <label>格宽</label><input type="number" step="0.01" id="t-${f.id}" value="${f.tile}">
        <label>格高</label><input type="number" step="0.01" id="ty-${f.id}" value="${f.tileY}"></div>
      <div class="row"><label>相位</label><input type="number" step="0.1" id="px-${f.id}" value="${f.phx}">
        <input type="number" step="0.1" id="py-${f.id}" value="${f.phy}"></div>
      <div class="row"><label>X</label><input type="number" step="1" id="x-${f.id}" value="${Math.round(f.x)}">
        <label>Y</label><input type="number" step="1" id="y-${f.id}" value="${Math.round(f.y)}"></div>`;
    box.appendChild(d);
    const bind = (id, key, int) => {
      const el = document.getElementById(id + '-' + f.id);
      el.addEventListener('input', () => { f[key] = int ? parseInt(el.value) : parseFloat(el.value); draw(); });
    };
    bind('t', 'tile'); bind('ty', 'tileY'); bind('px', 'phx'); bind('py', 'phy');
    bind('x', 'x', 1); bind('y', 'y', 1);
  }
}
function sync() {
  for (const f of FR) {
    const a = document.getElementById('x-' + f.id), b = document.getElementById('y-' + f.id);
    if (a) a.value = Math.round(f.x);
    if (b) b.value = Math.round(f.y);
  }
}
function pick(e) {
  const mx = (e.offsetX - panX) / zoom, my = (e.offsetY - panY) / zoom;
  const col = Math.round(mx / T);
  const f = FR.find(q => mx >= q.x - X0() && mx <= q.x - X0() + q.img.width) || FR[0];
  const phy = f.phy - YTOP();
  return { col, y: phy + Math.round((my - phy) / T) * T };
}
cvs.addEventListener('mousedown', e => {
  if (e.button === 2) { drag = { pan: 1, sx: e.offsetX, sy: e.offsetY, px: panX, py: panY }; return; }
  const mx = (e.offsetX - panX) / zoom, my = (e.offsetY - panY) / zoom;
  const hitF = FR.find(q => mx >= q.x - X0() && mx <= q.x - X0() + q.img.width &&
                            my >= q.y - YTOP() && my <= q.y - YTOP() + q.img.height);
  if (e.button === 1) { userMarks.delete(pick(e).col); stat(); draw(); return; }
  if (tool === 'erase') { userMarks.delete(pick(e).col); stat(); draw(); return; }
  if (e.shiftKey && hitF) { drag = { f: hitF, dx: mx, dy: my }; return; }   // 按住 Shift 拖动图片
  const p = pick(e);
  history.push([...userMarks.entries()]);
  userMarks.set(p.col, { y: p.y, t: tool });
  stat(); draw();
});
cvs.addEventListener('mousemove', e => {
  if (!drag) return;
  const r = cvs.getBoundingClientRect(), ox = e.clientX - r.left, oy = e.clientY - r.top;
  if (drag.pan) { panX = drag.px + (ox - drag.sx); panY = drag.py + (oy - drag.sy); }
  else if (drag.f) {
    const mx = (ox - panX) / zoom, my = (oy - panY) / zoom;
    drag.f.x += mx - drag.dx; drag.f.y += my - drag.dy;
    drag.dx = mx; drag.dy = my; sync();
  }
  draw();
});
addEventListener('mouseup', () => drag = null);
cvs.addEventListener('contextmenu', e => e.preventDefault());
cvs.addEventListener('wheel', e => {
  e.preventDefault();
  const k = e.deltaY < 0 ? 1.15 : 1 / 1.15;
  const mx = (e.offsetX - panX) / zoom, my = (e.offsetY - panY) / zoom;
  zoom *= k; panX = e.offsetX - mx * zoom; panY = e.offsetY - my * zoom; draw();
}, { passive: false });
const tb = document.getElementById('tools');
for (const t of TOOLS) {
  const b = document.createElement('button');
  b.className = 'tool' + (t.id === tool ? ' on' : ''); b.textContent = t.name;
  b.style.borderLeft = '6px solid ' + t.color;
  b.onclick = () => { tool = t.id; [...tb.children].forEach((c, i) => c.classList.toggle('on', TOOLS[i].id === tool)); };
  tb.appendChild(b);
}
function stat() {
  const n = { block: 0, slopeL: 0, slopeR: 0, tree: 0 };
  for (const m of userMarks.values()) if (n[m.t] !== undefined) n[m.t]++;
  document.getElementById('stat').textContent =
    `已标记 ${userMarks.size} 列 (方块 ${n.block}, 斜坡左 ${n.slopeL}, 斜坡右 ${n.slopeR}, 作废 ${n.tree})`;
}
document.getElementById('undo').onclick = () => { if (history.length) { userMarks = new Map(history.pop()); stat(); draw(); } };
document.getElementById('fit').onclick = () => {
  const w = Math.max(...FR.map(f => f.x + f.img.width)) - X0(), h = 900;
  zoom = Math.min(cvs.width / (w + 60), cvs.height / h);
  panX = 20; panY = 80; draw();
};
document.getElementById('export').onclick = () => {
  const y0 = YTOP();
  const cols = [...userMarks.entries()].sort((a, b) => a[0] - b[0])
    .map(([c, m]) => ({ c, y: Math.round((m.y + y0) * 10) / 10, t: m.t }));
  const frames = FR.map(f => ({ id: f.id, x: Math.round(f.x), y: Math.round(f.y), tile: f.tile,
                                tileY: f.tileY, phaseX: f.phx, phaseY: f.phy }));
  document.getElementById('out').value = JSON.stringify({ tile: T, frames, cols }, null, 0);
};
resize();
</script>
</body>
</html>
